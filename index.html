<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Вокал: ежедневная практика</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --bg:#FAF6F0;--card:#FFFFFF;--ink:#2B231E;--muted:#7A6E66;--line:#ECE3D8;
  --accent:#C8573A;--accent-soft:#F7E3DB;--ok:#3C8A5A;--ok-soft:#DFF0E5;
  --near:#C9922A;--near-soft:#F8ECD3;--bad:#C2443A;--bad-soft:#F7DEDB;
  --ear:#5B6FC7;--pitch:#C8573A;--rhythm:#3C8A7A;
  --r:16px;--shadow:0 1px 2px rgba(60,40,20,.05),0 4px 16px rgba(60,40,20,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1B1714;--card:#25201C;--ink:#F1E9E1;--muted:#A89B90;--line:#3A322C;
  --accent:#E57856;--accent-soft:#3D2820;--ok:#62B784;--ok-soft:#1F3428;
  --near:#E0B04F;--near-soft:#3A3020;--bad:#E8695E;--bad-soft:#3D2422;
  --ear:#8C9BF0;--pitch:#E57856;--rhythm:#5FBFAC;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Lora',Georgia,serif;font-weight:600;line-height:1.25;margin:0}
h1{font-size:28px}h2{font-size:21px}h3{font-size:17px;font-family:'Manrope',sans-serif;font-weight:700}
.app{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand b{font-family:'Lora',serif;font-size:19px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;display:grid;place-items:center}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{display:flex;max-width:760px;width:100%}
.tab{flex:1;border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);font-weight:600}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stack>*+*{margin-top:12px}
.sec{margin-top:26px}
.sec>h2{margin-bottom:10px}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.grid3{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--ink)}
.chip.ear{background:color-mix(in srgb,var(--ear) 15%,transparent);color:var(--ear)}
.chip.pitch{background:color-mix(in srgb,var(--pitch) 15%,transparent);color:var(--pitch)}
.chip.rhythm{background:color-mix(in srgb,var(--rhythm) 15%,transparent);color:var(--rhythm)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.near{background:var(--near-soft);color:var(--near)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
.lvl{display:flex;flex-direction:column;gap:6px}
.lvl .big{font-family:'Lora',serif;font-size:22px;font-weight:600}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;text-align:left}
.item+.item{margin-top:8px}
.item .dot{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px}
.dot.ear{background:color-mix(in srgb,var(--ear) 15%,transparent);color:var(--ear)}
.dot.pitch{background:color-mix(in srgb,var(--pitch) 15%,transparent);color:var(--pitch)}
.dot.rhythm{background:color-mix(in srgb,var(--rhythm) 15%,transparent);color:var(--rhythm)}
.item .t{flex:1;min-width:0}.item .t b{display:block}
.item.locked{opacity:.55}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 12px 40px}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:22px;height:22px;accent-color:var(--ok);flex:none;margin:1px 0 0}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.rate button span{font-size:22px}
.rate button.on.r3{border-color:var(--ok);background:var(--ok-soft)}
.rate button.on.r2{border-color:var(--near);background:var(--near-soft)}
.rate button.on.r1{border-color:var(--bad);background:var(--bad-soft)}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px}
textarea{min-height:84px;resize:vertical}
.back{border:0;background:none;color:var(--muted);font-weight:700;padding:6px 0;display:inline-flex;align-items:center;gap:6px;margin-bottom:8px}
.score{display:flex;gap:10px}
.score .s{flex:1;border-radius:14px;padding:12px;background:var(--bg);border:1px solid var(--line)}
.score .s b{display:block;font-family:'Lora',serif;font-size:26px}
.notes-list{margin:8px 0 0;padding:0;list-style:none}
.notes-list li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}
.notes-list li:first-child{border-top:0}
.notes-list .n{width:22px;color:var(--muted);font-weight:700;flex:none}
.mark{font-weight:800}.mark.ok{color:var(--ok)}.mark.near{color:var(--near)}.mark.off,.mark.missed{color:var(--bad)}
.tap{width:min(66vw,240px);aspect-ratio:1;border-radius:50%;border:0;background:var(--accent);color:#fff;font-weight:800;font-size:22px;margin:8px auto;display:grid;place-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent);touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .05s}
.tap:active,.tap.hit{transform:scale(.96)}
.tap:disabled{opacity:.4}
.quizq{text-align:center;padding:8px 0}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}
.answers button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 8px;font-weight:700}
.answers button.right{border-color:var(--ok);background:var(--ok-soft)}
.answers button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.verdict{margin-top:12px;padding:12px 14px;border-radius:12px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.note{padding:12px 14px;border-radius:12px;background:var(--near-soft);font-size:14.5px}
.info{padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:14.5px}
.hist-day{margin-top:18px;font-weight:800;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:50;max-width:90vw;text-align:center}
.sheet-bg{position:fixed;inset:0;background:rgba(20,12,6,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
.roll{width:100%;height:auto;display:block;margin-top:10px}
.lockline{font-size:13px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;padding:2px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;font-weight:700}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
a{color:var(--accent)}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.hidden{display:none!important}

.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.ggrid{grid-template-columns:repeat(2,1fr)}}
.gtile{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.gtile .gnum{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px;margin-bottom:4px}
.gtile.locked{opacity:.5;cursor:default}
.gstars{font-size:17px;letter-spacing:1px}
.gstage{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.gstage canvas{display:block}
details summary{cursor:pointer}
.tab span{white-space:nowrap}
@media(max-width:400px){.tab{font-size:10.5px}}

.app{padding-top:max(16px,env(safe-area-inset-top))}</style></head>
<body><div class="app"><header class="top"><div class="brand"><div class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2"/></svg></div><b>Вокал</b></div>
<button class="iconbtn" aria-label="Настройки" onclick="openSettings()" id="gear"></button></header>
<main id="view"></main></div><nav class="tabs" id="tabs"></nav>
<script>// ===== Анализ записи: высота тона, ноты, сравнение с эталоном =====
const VA = (() => {
  const A4 = 440;
  const hzToMidi = f => 69 + 12 * Math.log2(f / A4);
  const midiToHz = m => A4 * Math.pow(2, (m - 69) / 12);
  const median = a => { if (!a.length) return NaN; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const pct = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; };

  function toMono(chs) {
    if (chs.length === 1) return chs[0];
    const n = chs[0].length, y = new Float32Array(n);
    for (const c of chs) for (let i = 0; i < n; i++) y[i] += c[i] / chs.length;
    return y;
  }

  function decimate(x, sr) {
    const factor = Math.max(1, Math.round(sr / 11025));
    if (factor === 1) return { x, sr };
    const N = 31, h = new Float32Array(N), fc = 0.45 / factor; let sum = 0;
    for (let i = 0; i < N; i++) {
      const m = i - (N - 1) / 2;
      const s = m === 0 ? 2 * fc : Math.sin(2 * Math.PI * fc * m) / (Math.PI * m);
      h[i] = s * (0.54 - 0.46 * Math.cos(2 * Math.PI * i / (N - 1))); sum += h[i];
    }
    for (let i = 0; i < N; i++) h[i] /= sum;
    const len = Math.floor(x.length / factor), y = new Float32Array(len);
    for (let o = 0; o < len; o++) {
      const c = o * factor; let acc = 0;
      for (let k = 0; k < N; k++) { const idx = c + k - 15; if (idx >= 0 && idx < x.length) acc += h[k] * x[idx]; }
      y[o] = acc;
    }
    return { x: y, sr: sr / factor };
  }

  // YIN по одному кадру
  function yinFrame(x, off, W, sr, d, cm) {
    const tMin = Math.floor(sr / 1000), tMax = Math.ceil(sr / 65);
    for (let t = 1; t <= tMax; t++) {
      let s = 0;
      for (let i = 0; i < W; i++) { const v = x[off + i] - x[off + i + t]; s += v * v; }
      d[t] = s;
    }
    let run = 0; cm[0] = 1;
    for (let t = 1; t <= tMax; t++) { run += d[t]; cm[t] = run > 0 ? d[t] * t / run : 1; }
    let tau = -1;
    for (let t = tMin; t <= tMax; t++) {
      if (cm[t] < 0.15) { while (t + 1 <= tMax && cm[t + 1] < cm[t]) t++; tau = t; break; }
    }
    if (tau < 0) {
      let best = 1, bt = -1;
      for (let t = tMin; t <= tMax; t++) if (cm[t] < best) { best = cm[t]; bt = t; }
      if (best < 0.3) tau = bt; else return null;
    }
    let bt = tau;
    if (tau > tMin && tau < tMax) {
      const a = cm[tau - 1], b = cm[tau], c = cm[tau + 1], den = a - 2 * b + c;
      if (den !== 0) bt = tau + 0.5 * (a - c) / den;
    }
    return { f: sr / bt, conf: 1 - cm[tau] };
  }

  function track(x, sr) {
    const W = Math.round(sr * 0.046), hop = Math.round(sr * 0.01), tMax = Math.ceil(sr / 65);
    const d = new Float32Array(tMax + 2), cm = new Float32Array(tMax + 2);
    const frames = [];
    for (let off = 0; off + W + tMax + 1 < x.length; off += hop) {
      let e = 0; for (let i = 0; i < W; i++) e += x[off + i] * x[off + i];
      const rms = Math.sqrt(e / W);
      frames.push({ t: (off + W / 2) / sr, rms, off });
    }
    if (!frames.length) return frames;
    const gate = Math.max(0.15 * pct(frames.map(f => f.rms), 0.95), 1e-4);
    for (const f of frames) {
      f.midi = null;
      if (f.rms < gate) continue;
      const p = yinFrame(x, f.off, W, sr, d, cm);
      if (p && p.conf > 0.75 && p.f >= 65 && p.f <= 1000) f.midi = hzToMidi(p.f);
    }
    // медианный фильтр против октавных скачков
    const raw = frames.map(f => f.midi);
    for (let i = 0; i < frames.length; i++) {
      if (raw[i] == null) continue;
      const w = []; for (let k = -2; k <= 2; k++) { const v = raw[i + k]; if (v != null) w.push(v); }
      if (w.length >= 3) frames[i].midi = median(w);
    }
    return frames;
  }

  function segment(frames) {
    let segs = [], cur = null, gap = 0, jump = 0;
    const close = (s) => { if (s && s.frames.length) segs.push(s); };
    for (let i = 0; i < frames.length; i++) {
      const f = frames[i];
      if (f.midi == null) { gap++; if (cur && gap > 4) { close(cur); cur = null; } continue; }
      gap = 0;
      if (!cur) { cur = { frames: [f] }; jump = 0; continue; }
      const body = cur.frames.slice(0, Math.max(1, cur.frames.length - jump)).slice(-40).map(z => z.midi);
      const ref = median(body);
      if (Math.abs(f.midi - ref) > 0.55) {
        jump++;
        if (jump >= 6) {
          const moved = cur.frames.splice(cur.frames.length - 5, 5);
          close(cur); cur = { frames: [...moved, f] }; jump = 0;
          continue;
        }
      } else jump = 0;
      cur.frames.push(f);
    }
    close(cur);
    // разрез по провалу громкости (повтор той же ноты)
    const out = [];
    for (const s of segs) {
      const r = s.frames.map(z => z.rms);
      const sm = r.map((_, i) => { let a = 0, n = 0; for (let k = -2; k <= 2; k++) if (r[i + k] != null) { a += r[i + k]; n++; } return a / n; });
      let start = 0;
      for (let i = 10; i < sm.length - 10; i++) {
        if (sm[i] <= sm[i - 1] && sm[i] <= sm[i + 1]) {
          const before = Math.max(...sm.slice(start, i)), after = Math.max(...sm.slice(i + 1));
          if (sm[i] < 0.45 * Math.min(before, after) && i - start >= 10) {
            out.push({ frames: s.frames.slice(start, i) }); start = i + 1;
          }
        }
      }
      out.push({ frames: s.frames.slice(start) });
    }
    return out.map(s => {
      const n = s.frames.length, a = Math.floor(n * 0.15), b = Math.max(a + 1, Math.ceil(n * 0.85));
      const core = s.frames.slice(a, b).map(z => z.midi);
      const pitch = median(core);
      const sd = Math.sqrt(core.reduce((acc, v) => acc + (v - pitch) ** 2, 0) / core.length);
      return { start: s.frames[0].t, end: s.frames[n - 1].t + 0.01, pitch, wobble: sd * 100 };
    }).filter(s => s.end - s.start >= 0.09);
  }

  // Выравнивание эталона и спетых нот (глобальное, с пропусками)
  function alignWith(ref, segs, o) {
    const n = ref.length, m = segs.length, GAP_REF = 2.5, GAP_SEG = 1.0;
    const D = Array.from({ length: n + 1 }, () => new Float64Array(m + 1));
    const B = Array.from({ length: n + 1 }, () => new Int8Array(m + 1));
    for (let i = 1; i <= n; i++) { D[i][0] = i * GAP_REF; B[i][0] = 1; }
    for (let j = 1; j <= m; j++) { D[0][j] = j * GAP_SEG; B[0][j] = 2; }
    for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) {
      const c = Math.min(Math.abs(segs[j - 1].pitch - o - ref[i - 1]), 4);
      let best = D[i - 1][j - 1] + c, bb = 0;
      if (D[i - 1][j] + GAP_REF < best) { best = D[i - 1][j] + GAP_REF; bb = 1; }
      if (D[i][j - 1] + GAP_SEG < best) { best = D[i][j - 1] + GAP_SEG; bb = 2; }
      D[i][j] = best; B[i][j] = bb;
    }
    const pairs = new Array(n).fill(-1), extra = [];
    let i = n, j = m;
    while (i > 0 || j > 0) {
      const b = B[i][j];
      if (i > 0 && j > 0 && b === 0) { pairs[i - 1] = j - 1; i--; j--; }
      else if (i > 0 && (j === 0 || b === 1)) { i--; }
      else { extra.push(j - 1); j--; }
    }
    return { cost: D[n][m], pairs, extra };
  }

  function align(ref, segs, anyKey) {
    let cands;
    if (anyKey) { cands = []; for (const s of segs) for (const r of ref) cands.push(s.pitch - r); }
    else cands = [-24, -12, 0, 12, 24];
    if (!cands.length) cands = [0];
    let best = null;
    for (const o of cands) { const a = alignWith(ref, segs, o); if (!best || a.cost < best.cost) best = { ...a, o }; }
    if (anyKey) {
      const diffs = best.pairs.map((j, i) => j >= 0 ? segs[j].pitch - ref[i] : null).filter(v => v != null && Math.abs(v - best.o) < 1);
      if (diffs.length) { const o = median(diffs); best = { ...alignWith(ref, segs, o), o }; }
    }
    return best;
  }

  const NOTE_NAMES = ['До', 'До#', 'Ре', 'Ре#', 'Ми', 'Фа', 'Фа#', 'Соль', 'Соль#', 'Ля', 'Ля#', 'Си'];
  const noteName = m => { const r = Math.round(m); return NOTE_NAMES[((r % 12) + 12) % 12]; };

  // ref: [{midi, beats}], segs: результат segment()
  function evaluate(ref, segs, anyKey) {
    const refM = ref.map(r => r.midi);
    const a = align(refM, segs, anyKey);
    const notes = ref.map((r, i) => {
      const j = a.pairs[i];
      if (j < 0) return { i, ref: r.midi, status: 'missed' };
      const s = segs[j], dev = Math.round((s.pitch - a.o - r.midi) * 100);
      const ad = Math.abs(dev);

  for (const [s, beats] of notes) { tone(base() + s + offset, t, beats * b * .95); t += beats * b; }

  stopAll(); const c = ac(), b = 60 / ex.bpm, t0 = c.currentTime + .1;

// Октава голоса: определяется по первым нотам и дальше не меняется,
// чтобы мужской и женский голос подходили, но нижнее и верхнее До различались
function octLock(S, v, target) {
  if (S.oct == null) {
    (S.octBuf ||= []).push(v - target);
    if (S.octBuf.length >= 8) S.oct = 12 * Math.round(VA.median(S.octBuf) / 12);
    return v - 12 * Math.round((v - target) / 12);
  }
  return v - S.oct;
}

    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    store.db = db; store.uid = id;

    const [a, b] = await Promise.all([db.doc(root + '/state').get(), db.doc(root + '/sessions').get()]);

const NEED_CONF = 3, NEED_DAYS = 2;
function levelInfo(cat) {
  let open = 1, passed = 0; const prog = {};
  for (let L = 1; L <= 3; L++) {
    const conf = state.sessions.filter(s => s.cat === cat && s.level === L && s.rating === 3);
    const days = new Set(conf.map(s => s.date.slice(0, 10))).size;
    prog[L] = { conf: conf.length, days };
    if (conf.length >= NEED_CONF && days >= NEED_DAYS) { passed = L; open = Math.min(3, L + 1); } else break;
  }
  const any = state.sessions.some(s => s.cat === cat);
  return { open, passed, prog: prog[open] || { conf: 0, days: 0 }, any, done3: passed === 3 };
}
function isUnlocked(ex) { return ex.level <= levelInfo(ex.cat).open; }
function srsUpdate(exId, rating) {
  const today = ymd(), cur = state.srs[exId] || { box: 0 };
  let box = cur.box, interval;
  if (rating === 3) { box = Math.min(box + 1, 5); interval = [1, 2, 4, 7, 14, 30][box]; }
  else if (rating === 2) { interval = 2; }
  else { box = 0; interval = 1; }
  state.srs[exId] = { box, due: addDays(today, interval), last: today, lastRating: rating };
  return interval;
}
function dueList() {
  const t = ymd();
  return EXERCISES.filter(e => state.srs[e.id] && state.srs[e.id].due <= t && isUnlocked(e))
    .sort((a, b) => (state.srs[a.id].lastRating - state.srs[b.id].lastRating) || state.srs[a.id].due.localeCompare(state.srs[b.id].due));
}
function freshList() {
  const out = [];
  for (const cat of Object.keys(CATS)) {
    const lv = levelInfo(cat).open;
    const e = EXERCISES.find(x => x.cat === cat && x.level <= lv && !state.srs[x.id]);
    if (e) out.push(e);

}

  const days = new Set(state.sessions.map(s => s.date.slice(0, 10)));

function pitchAssessment() {

  for (const s of checks) if (s.auto.score >= 80 && (!best || s.level > best.level || (s.level === best.level && s.auto.score > best.auto.score))) best = s;

let run = null; // текущее занятие: { ex, auto, rating, crit }
function rollSVG(notes, result) {
  const n = notes.length, W = 640, H = 170, pad = 28;
  const semis = notes.map(x => x[0]);
  const sung = result ? result.notes.map(r => r.sung != null ? r.sung - result.offset - base() : null) : [];
  const all = semis.concat(sung.filter(v => v != null));
  let lo = Math.min(...all) - 1.5, hi = Math.max(...all) + 1.5; if (hi - lo < 8) { const m = (hi + lo) / 2; lo = m - 4; hi = m + 4; }
  const y = s => pad / 2 + (H - pad) * (1 - (s - lo) / (hi - lo));
  const totalBeats = notes.reduce((a, x) => a + x[1], 0);
  let x0 = 8; const bw = (W - 16) / totalBeats;
  let out = `<svg class="roll" viewBox="0 0 ${W} ${H + 18}" role="img" aria-label="Ноты мелодии">`;
  for (let s = Math.ceil(lo); s <= Math.floor(hi); s++) out += `<line x1="0" x2="${W}" y1="${y(s)}" y2="${y(s)}" stroke="var(--line)" stroke-width="${s % 12 === 0 ? 1.4 : .6}"/>`;
  notes.forEach(([s, b], i) => {
    const w = b * bw - 6;
    out += `<rect x="${x0}" y="${y(s) - 6}" width="${w}" height="12" rx="6" fill="var(--muted)" opacity=".35"/>`;

function rhythmSVG(ex) {

// ===== Слух: квиз =====
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const QUIZ_OPTS = {
  updown: ['Выше', 'Ниже'], samediff: ['Одинаковые', 'Разные'],
  contour: ['Вверх-вверх', 'Вниз-вниз', 'Вверх-вниз', 'Вниз-вверх'],
  interval: ['Терция', 'Квинта', 'Октава'], majmin: ['Мажор', 'Минор'],
};
function makeQ(ex) {
  const b = base() + rnd(0, 7), sp = ex.spread || [2, 4];
  switch (ex.quiz) {
    case 'updown': { const up = Math.random() < .5, d = rnd(sp[0], sp[1]); return { seq: [[b, 1], [b + (up ? d : -d), 1]], ans: up ? 0 : 1 }; }
    case 'samediff': { const same = Math.random() < .5, d = rnd(sp[0], sp[1]) * (Math.random() < .5 ? 1 : -1); return { seq: [[b, 1], [same ? b : b + d, 1]], ans: same ? 0 : 1 }; }
    case 'contour': { const k = rnd(0, 3), s1 = rnd(2, 4), s2 = rnd(2, 4); const d = [[1, 1], [-1, -1], [1, -1], [-1, 1]][k]; const m = b + 2; return { seq: [[m, .8], [m + d[0] * s1, .8], [m + d[0] * s1 + d[1] * s2, .8]], ans: k }; }
    case 'interval': { const k = rnd(0, 2), iv = [4, 7, 12][k]; const lo = base() + rnd(0, 4); return { seq: [[lo, 1], [lo + iv, 1]], ans: k }; }
    case 'majmin': { const k = rnd(0, 1), t = k ? 3 : 4; return { seq: [[b, .5], [b + t, .5], [b + 7, .5]], chord: [b, b + t, b + 7], ans: k }; }
  }
}
function playQ(q, bpm = 80) {
  stopAll(); const c = ac(), bt = 60 / bpm; let t = c.currentTime + .06;
  for (const [m, beats] of q.seq) { tone(m, t, beats * bt * .92); t += beats * bt; }
  if (q.chord) { t += .15; q.chord.forEach(m => tone(m, t, 1.4, .16)); }
}
function quizSample(id) { playQ(makeQ(exById(id))); }
function intervalRefs() {
  return `<div class="row wrap" style="margin-bottom:12px;gap:6px"><span class="small muted">Эталоны:</span>${['Терция', 'Квинта', 'Октава'].map((n, i) => `<button class="btn ghost" style="min-height:38px;padding:6px 12px" onclick="playQ({seq:[[base(),1],[base()+${[4, 7, 12][i]},1]]})">${n}</button>`).join('')}</div>`;
}
let quiz = null;
function startQuiz() { quiz = { i: 0, right: 0, mistakes: [], q: makeQ(run.ex), answered: false }; drawQuiz(); playQ(quiz.q); }
function drawQuiz() {
  const ex = run.ex, opts = QUIZ_OPTS[ex.quiz], el = $('#practice');
  if (quiz.i >= 10) {
    const score = quiz.right * 10;
    run.auto = { type: 'quiz', score, right: quiz.right, total: 10 };
    el.innerHTML = `<h3>Результат</h3><div class="score" style="margin-top:10px"><div class="s"><b>${quiz.right} из 10</b><span class="small muted">верных ответов</span></div></div>
      ${quiz.mistakes.length ? `<p class="small" style="margin:12px 0 4px"><b>Ошибки:</b></p><ul class="notes-list">${quiz.mistakes.map(m => `<li><span class="n">${m.n}</span><span>Ответ «${m.you}», а верно «${m.right}»</span></li>`).join('')}</ul>` : '<p class="small" style="margin:12px 0 0">Без ошибок 👏</p>'}
      <button class="btn ghost block" style="margin-top:12px" onclick="startQuiz()">Пройти ещё раз</button>`;
    suggestFromAuto(score, 'верных ответов');
    return;
  }
  el.innerHTML = `<div class="row between"><h3>Вопрос ${quiz.i + 1} из 10</h3><span class="small muted">Верно: ${quiz.right}</span></div>
    ${ex.quiz === 'interval' ? '<div style="margin-top:10px">' + intervalRefs() + '</div>' : ''}
    <div class="quizq"><button class="btn soft" onclick="playQ(quiz.q)">${ICON.play} Прослушать ещё раз</button></div>
    <div class="answers">${opts.map((o, k) => `<button data-k="${k}" onclick="answerQuiz(${k})">${o}</button>`).join('')}</div><div id="verdict"></div>`;
}
function answerQuiz(k) {
  if (quiz.answered) return; quiz.answered = true;
  const opts = QUIZ_OPTS[run.ex.quiz], ok = k === quiz.q.ans;
  if (ok) quiz.right++; else quiz.mistakes.push({ n: quiz.i + 1, you: opts[k], right: opts[quiz.q.ans] });
  document.querySelectorAll('.answers button').forEach(b => { const kk = +b.dataset.k; if (kk === quiz.q.ans) b.classList.add('right'); else if (kk === k) b.classList.add('wrong'); });
  $('#verdict').innerHTML = `<div class="verdict ${ok ? 'ok' : 'bad'}">${ok ? '✓ Верно' : '✗ Неверно. Правильный ответ: ' + opts[quiz.q.ans]}</div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="playQ(quiz.q)">${ICON.play} Переслушать</button><button class="btn" style="flex:1" onclick="nextQuiz()">Дальше</button></div>`;
}
function nextQuiz() { quiz.i++; quiz.answered = false; if (quiz.i < 10) { quiz.q = makeQ(run.ex); drawQuiz(); playQ(quiz.q); } else drawQuiz(); }

// ===== Запись и проверка голоса =====
let rec = null;

    <div class="tiny muted" style="margin-top:8px">«Записать голос» откроет камеру телефона: сними видео, пока поёшь (можно закрыть объектив пальцем), и нажми «Использовать видео». Из видео я возьму только звук. На компьютере выбери готовую аудиозапись.</div>`}

function resultHTML(ref, ev, audio) {
  const n = ev.notes.length;
  const lines = ev.notes.map((r, i) => {
    const nm = VA.noteName(base() + ref.notes[i][0]);
    let t;
    if (r.status === 'missed') t = '<span class="mark missed">✗ не спета</span>';
    else {
      const dir = r.dev > 0 ? 'выше' : 'ниже', ad = Math.abs(r.dev);
      const amount = ad >= 85 ? (Math.round(ad / 100) === 1 ? 'на полтона' : 'на ' + Math.round(ad / 100) + ' полутона') : 'на ' + ad + ' центов';
      if (r.status === 'ok') t = `<span class="mark ok">✓ верно</span> <span class="muted tiny">(${r.dev >= 0 ? '+' : ''}${r.dev} ц)</span>`;

      else t = `<span class="mark off">✗ мимо</span>, ${dir} ${amount}`;
    }

    return `<li><span class="n">${i + 1}</span><span><b>${nm}</b>: ${t}</span></li>`;
  }).join('');
  const sung = ev.notes.filter(r => r.dev != null);
  const avg = sung.length ? Math.round(sung.reduce((a, r) => a + r.dev, 0) / sung.length) : 0;
  let tip = '';
  if (ev.anyKey) tip = 'Сравнение по расстояниям между нотами, тональность не учитывалась.';
  else if (Math.abs(avg) > 25 && sung.length >= 2) tip = `В среднем ты поёшь ${avg > 0 ? 'выше' : 'ниже'} примера на ${Math.abs(avg)} центов. ${avg < 0 ? 'Попробуй больше «улыбки» в гласной и активнее дыхание.' : 'Расслабь горло и не дави на верх.'}`;
  if (ev.offset && !ev.anyKey) tip += (tip ? ' ' : '') + `Ты пел на ${ev.offset > 0 ? 'октаву выше' : 'октаву ниже'} примера, это нормально.`;

  if (missed) tip += (tip ? ' ' : '') + `Не нашёл ${missed} ${plural(missed, 'ноту', 'ноты', 'нот')}: возможно, они слились с соседней или были слишком тихими.`;
  return `<div class="score" style="margin-top:14px"><div class="s"><b>${ev.pitchScore}%</b><span class="small muted">точность нот</span></div>
    ${ev.rhythmScore != null ? `<div class="s"><b>${ev.rhythmScore}%</b><span class="small muted">ритм</span></div>` : ''}

    ${rollSVG(ref.notes, ev)}
    <div class="tiny muted" style="margin-top:4px">Серым: как надо. Цветом: как спето. Зелёный верно (до 30 ц), жёлтый близко (до 60 ц), красный мимо.</div>
    <ul class="notes-list">${lines}</ul>
    ${tip ? `<div class="info" style="margin-top:10px">${esc(tip)}</div>` : ''}
    <div class="row wrap" style="margin-top:12px"><button class="btn ghost" onclick="playNotes(${JSON.stringify(ref.notes)},${ref.bpm})">${ICON.play} Как надо</button>
    <button class="btn ghost" onclick="playAudioLast()">${ICON.play} Моя запись</button></div>`;
}
let lastAudio = null;
function playAudioLast() { if (!lastAudio) return; stopAll(); const s = ac().createBufferSource(); s.buffer = lastAudio; s.connect(master); s.start(); playing.push(s); }

// ===== Ритм: тап =====
function tapUI(box) {
  const ex = run.ex;
  box.innerHTML = `<button class="tap" id="tapbtn" disabled>Тап</button><div class="row" style="justify-content:center"><button class="btn" id="tapstart">${ICON.play} Начать проверку</button></div><div id="tapmsg" class="small muted" style="text-align:center;margin-top:8px"></div><div id="tapres"></div>`;
  const btn = $('#tapbtn'); let taps = [], live = false, sch = null, perf0 = 0, ctx0 = 0;
  const now = () => ctx0 + (performance.now() - perf0) / 1000;
  const hit = e => { if (!live) return; e.preventDefault(); taps.push(now()); btn.classList.add('hit'); setTimeout(() => btn.classList.remove('hit'), 80); };
  btn.addEventListener('pointerdown', hit);
  const key = e => { if (e.code === 'Space' && live) hit(e); };
  document.addEventListener('keydown', key);
  $('#tapstart').addEventListener('click', () => {
    const c = ac(); taps = []; perf0 = performance.now(); ctx0 = c.currentTime;
    sch = playRhythm(ex, false); live = true; btn.disabled = false; busy = true;
    $('#tapstart').disabled = true; $('#tapres').innerHTML = '';
    $('#tapmsg').textContent = 'Слушай отсчёт: раз, два, три, четыре...';
    const startAt = sch.t0 + 4 * sch.b;
    setTimeout(() => { if (live && $('#tapmsg')) $('#tapmsg').textContent = 'Стучи!'; }, (startAt - c.currentTime) * 1000);
    setTimeout(() => {
      if (!document.body.contains(box)) { live = false; busy = false; return; } // ушли со страницы
      live = false; btn.disabled = true; busy = false; $('#tapstart').disabled = false; $('#tapstart').innerHTML = ICON.play + ' Ещё раз';
      $('#tapmsg').textContent = '';
      const lat = (c.outputLatency || c.baseLatency || 0) + (state.settings.latency || 0) / 1000;
      const targets = ex.onsets.map(o => startAt + o * sch.b);
      const ev = VA.evaluateTaps(targets, taps.filter(t => t > startAt - .3), lat);
      $('#tapres').innerHTML = tapResultHTML(ex, ev, sch.b);
      run.auto = { type: 'tap', score: ev.score, meanDev: ev.meanDev, extra: ev.extra };
      suggestFromAuto(ev.score, 'точность ритма');
    }, (sch.end - c.currentTime + .5) * 1000);
  });
}
function tapResultHTML(ex, ev, b) {
  const ok = ev.res.filter(r => r.status === 'ok').length, n = ev.res.length;
  const beats = Math.ceil(Math.max(...ex.onsets) + 1), bars = Math.ceil(beats / 4) * 4, W = 640, H = 60, bw = (W - 20) / bars;
  let svg = `<svg class="roll" viewBox="0 0 ${W} ${H}">`;
  for (let i = 0; i <= bars; i++) svg += `<line x1="${10 + i * bw}" x2="${10 + i * bw}" y1="6" y2="${H - 6}" stroke="var(--line)" stroke-width="${i % 4 === 0 ? 2 : 1}"/>`;
  ev.res.forEach((r, i) => {
    const x = 10 + ex.onsets[i] * bw + 4;
    svg += `<circle cx="${x}" cy="${H / 2}" r="7" fill="none" stroke="var(--muted)" stroke-width="2"/>`;
    if (r.dev != null) { const col = r.status === 'ok' ? 'var(--ok)' : r.status === 'near' ? 'var(--near)' : 'var(--bad)'; svg += `<circle cx="${x + r.dev / 1000 / b * bw}" cy="${H / 2}" r="5" fill="${col}"/>`; }
    else svg += `<text x="${x}" y="${H / 2 + 5}" text-anchor="middle" font-size="15" font-weight="800" fill="var(--bad)">×</text>`;
  });
  svg += '</svg>';
  const missed = ev.res.filter(r => r.status === 'missed').length;
  let tip = Math.abs(ev.meanDev) > 35 ? `В среднем ты ${ev.meanDev < 0 ? 'спешишь' : 'опаздываешь'} на ${Math.abs(ev.meanDev)} мс.` : 'В среднем попадаешь в долю, без спешки и опозданий.';
  if (missed) tip += ` Пропущено: ${missed}.`;
  if (ev.extra) tip += ` Лишних нажатий: ${ev.extra}.`;
  return `<div class="score" style="margin-top:12px"><div class="s"><b>${ev.score}%</b><span class="small muted">точность ритма</span></div><div class="s"><b>${ok}/${n}</b><span class="small muted">точно в долю</span></div></div>
    ${svg}<div class="tiny muted">Кружок: где нужно было. Точка: твоё нажатие. Зелёный до 70 мс, жёлтый до 140 мс.</div>
    <div class="info" style="margin-top:10px">${tip}</div>
    <p class="tiny muted">Если все нажатия смещены одинаково (например, в Bluetooth-наушниках), настрой задержку звука в настройках ⚙.</p>`;
}

function doDelete(id) {
  state.sessions = state.sessions.filter(s => s.id !== id);

  state.srs = {};

    const cur = state.srs[s.ex] || { box: 0 }; let box = cur.box, iv;
    if (s.rating === 3) { box = Math.min(box + 1, 5); iv = [1, 2, 4, 7, 14, 30][box]; } else if (s.rating === 2) iv = 2; else { box = 0; iv = 1; }

    <button class="btn ghost" onclick="calibrate()">Настроить: стучи в такт 8 щелчкам</button></div>
    <div class="card stack"><h3>Данные</h3><p class="small muted" style="margin:0" id="savebadge">${saveText()}</p>

function calibrate() {
  const c = ac(), b = 60 / 90, t0 = c.currentTime + .3, taps = [], perf0 = performance.now(), ctx0 = c.currentTime;
  stopAll(); for (let i = 0; i < 8; i++) click(t0 + i * b, i % 4 === 0);
  const btn = $('#calbtn'); btn.disabled = false; $('#calmsg').textContent = 'Стучи вместе со щелчками';
  btn.onpointerdown = e => { e.preventDefault(); taps.push(ctx0 + (performance.now() - perf0) / 1000); };
  setTimeout(() => {
    btn.disabled = true; btn.onpointerdown = null;
    const lat0 = c.outputLatency || c.baseLatency || 0;
    const devs = taps.map(t => { let best = 9; for (let i = 0; i < 8; i++) { const d = t - lat0 - (t0 + i * b); if (Math.abs(d) < Math.abs(best)) best = d; } return best; }).filter(d => Math.abs(d) < .35);
    if (devs.length < 5) { $('#calmsg').textContent = 'Мало нажатий, попробуй ещё раз.'; return; }
    const ms = Math.round(VA.median(devs) * 1000); state.settings.latency = ms; save();
    $('#calmsg').textContent = `Готово: задержка ${ms} мс. Учту её в проверке ритма.`;
  }, (t0 + 8 * b - c.currentTime + .6) * 1000);
}

    if (!a.segs.length) { $('#gres').innerHTML = '<div class="note" style="margin-top:10px">Не слышу в записи голоса. Пой громче и ближе к телефону, на «ма» или «ла».</div>'; return; }

    walls: [[0, 1, 0], [7, 2, 0], [5, 1, 0], [9, 2, 0], [7, 1, 0], [4, 1, 0], [2, 1, 0], [0, 2, 1]] },
  { n: 11, title: 'Мелодия: октава', hint: 'Самый высокий взлёт', tol: 45, bpm: 70, guide: false,
    walls: [[0, 2, 0], [12, 2, 0], [7, 1, 0], [4, 1, 0], [5, 1, 0], [2, 1, 0], [0, 2, 1]] },
  { n: 12, title: 'Финал', hint: 'Быстрая мелодия на всё сразу', tol: 40, bpm: 84, guide: false,
    walls: [[0, 1, 0], [4, 1, 0], [7, 1, 0], [9, 2, 0], [7, 1, 0], [5, 1, 0], [4, 1, 0], [2, 1, 0], [4, 1, 0], [7, 2, 0], [12, 2, 0], [7, 1, 0], [4, 1, 0], [0, 3, 1]] },
];
const ballState = () => { state.ball ||= { best: {}, plays: [] }; return state.ball; };
const PRESETS = [['Простой', 40], ['Средний', 20], ['Сложный', 10]];
const ballTol = () => Math.max(1, Math.min(50, Math.round(state.settings.tol || 40)));
const tolZone = t => t >= 30 ? 'простой' : t >= 15 ? 'средний' : t >= 6 ? 'сложный' : 'экстрим';
// рекорд уровня с учётом ширины окошка: уже окошко = ценнее
const bestTol = (b, n) => b.tol || (BALL_LEVELS.find(l => l.n === n) || {}).tol || 40;
const rank = (stars, pct, tol) => stars >= 1 ? 1e5 + (60 - tol) * 1000 + stars * 100 + pct : pct;
function setTol(v, rerender) { state.settings.tol = Math.max(1, Math.min(50, +v)); save(); if (rerender) render(); }
function tolLabel(t) { return `±${t} центов · ${tolZone(t)}${t <= 5 ? ' (нужен очень ровный голос)' : ''}`; }
function diffSeg() {
  const t = ballTol();
  return `<div class="card sec stack" style="padding:14px"><div class="row between"><span class="small"><b>Ширина дырки</b></span><span class="small" id="tolLbl">${tolLabel(t)}</span></div>
    <input type="range" min="1" max="50" step="1" value="${t}" style="width:100%;accent-color:var(--accent)" aria-label="Ширина дырки в центах"
      oninput="document.getElementById('tolLbl').textContent=tolLabel(+this.value)" onchange="setTol(this.value,true)">
    <div class="row" style="justify-content:space-between"><span class="tiny muted">±1 узко</span><span class="tiny muted">±50 широко</span></div>
    <div class="row wrap" style="gap:6px">${PRESETS.map(([n, v]) => `<button class="btn ${t === v ? 'soft' : 'ghost'}" style="min-height:36px;padding:6px 12px;flex:1" onclick="setTol(${v},true)">${n} ±${v}</button>`).join('')}</div></div>`;
}
const ballUnlocked = n => n === 1 || (ballState().best[n - 1]?.stars || 0) >= 1;
const ballStarsFor = (pct, lives) => lives <= 0 ? 0 : pct >= 100 ? 3 : pct >= 80 ? 2 : pct >= 60 ? 1 : 0;

function viewBall() {
  const g = ballState(), total = Object.values(g.best).reduce((a, x) => a + x.stars, 0);
  let h = `<h1>Шарик</h1><p class="muted" style="margin:6px 0 0">Шарик катится по дорожке, впереди стены с дырками. Пой ноту, и шарик поднимется на её высоту: чем выше дырка, тем выше нота. Сначала отдельные ноты, потом тоннели и мелодии.</p>
    ${diffSeg()}
    <div class="row sec" style="margin-top:14px;gap:8px"><span class="pill">★ ${total} из ${BALL_LEVELS.length * 3}</span><span class="pill">Пройдено: ${Object.values(g.best).filter(x => x.stars >= 1).length} из ${BALL_LEVELS.length}</span></div>
    <div class="ggrid sec">`;
  for (const lv of BALL_LEVELS) {
    const best = g.best[lv.n], open = ballUnlocked(lv.n);
    h += `<button class="gtile ${open ? '' : 'locked'}" ${open ? `onclick="go('ball-${lv.n}')"` : ''}>
      <span class="gnum">${open ? lv.n : '🔒'}</span><b>${esc(lv.title)}</b><span class="gstars">${starStr(best ? best.stars : 0)}</span>
      <span class="tiny muted">${best ? 'лучший ' + best.pct + '% при ±' + bestTol(best, lv.n) : open ? (lv.n >= 7 ? 'мелодия' : 'ноты') : 'пройди уровень ' + (lv.n - 1)}</span></button>`;
  }
  h += `</div><p class="tiny muted">3 жизни. Звёзды: 1 за 60% стен, 2 за 80%, 3 за все стены. Уровень пройден с одной звезды, тогда открывается следующий. В рекорде запоминается ширина дырки: чем уже, тем ценнее.</p>
    <button class="item sec" onclick="go('game')"><div class="dot pitch">🎯</div><div class="t"><b>Ещё игра: «Попади в ноту»</b><span class="small muted">Ноты-полосы, 12 уровней</span></div><span class="muted">›</span></button>`;
  return h;
}

let B = null;
function ballStop() {
  if (!B) return;
  B.stopped = true; cancelAnimationFrame(B.raf);
  if (B.stream) B.stream.getTracks().forEach(t => t.stop());
  stopAll(); B = null; busy = false;
}
function viewBallLevel(n) {
  const lv = BALL_LEVELS.find(l => l.n === n);
  if (!lv) return '<div class="empty">Уровень не найден</div>';
  if (!ballUnlocked(n)) return `<button class="back" onclick="go('ball')">${ICON.back} Уровни</button><div class="note">🔒 Сначала пройди уровень ${n - 1} хотя бы на одну звезду.</div>`;
  const best = ballState().best[n];
  afterHooks.push(() => ballSetup(lv));
  return `<button class="back" onclick="go('ball')">${ICON.back} Все уровни</button>
    <div class="row between"><div><div class="tiny muted">Уровень ${n} из ${BALL_LEVELS.length} · дырка ±${ballTol()} центов</div><h1 style="margin-top:2px">${esc(lv.title)}</h1></div><div style="font-size:22px" id="bstars">${starStr(best ? best.stars : 0)}</div></div>
    <p class="muted" style="margin:4px 0 0">${esc(lv.hint)}.</p>
    ${diffSeg()}
    <div id="bbest">${ballBestHTML(lv)}</div>
    <div class="gstage sec"><canvas id="bcv"></canvas></div>
    <div id="bctl" class="stack" style="margin-top:12px"></div><div id="bnote"></div><div id="bres"></div>`;
}

function ballBestHTML(lv) {
  const best = ballState().best[lv.n]; if (!best) return '';
  const next = lv.n < BALL_LEVELS.length && ballUnlocked(lv.n + 1);
  return `<div class="card row between wrap" style="margin-top:12px;gap:8px;padding:12px 14px"><div><div class="tiny muted">Твой рекорд сохранён</div><b>${starStr(best.stars)} ${best.pct}% стен при ±${bestTol(best, lv.n)}</b></div>
    ${next ? `<button class="btn soft" style="min-height:40px" onclick="go('ball-${lv.n + 1}')">Уровень ${lv.n + 1} →</button>` : ''}</div>`;
}
function ballBuild(lv) {
  const b = 60 / lv.bpm; let t = 0; const walls = [];
  lv.walls.forEach(([s, len, gap], i) => {
    // окно для смены ноты: если нота идёт сразу за другой, тоннель начинается чуть позже её начала
    const prev = lv.walls[i - 1];
    const open = prev && prev[2] < .5 && prev[0] !== s ? Math.min(Math.max(.4, .45 * b), len * b * .55) : 0;
    walls.push({ rel: s, t0: t + open, t1: t + len * b, crashed: false, passed: false, inT: 0, outT: 0 });
    t += (len + gap) * b;
  });
  // соседние тоннели без паузы склеиваются визуально
  return { walls, D: t };
}
function ballSetup(lv) {
  const { walls, D } = ballBuild(lv), cv = $('#bcv');
  B = { lv, walls, D, cv, ctx: cv.getContext('2d'), mode: 'idle', y: null, vy: 0, lives: 3, trail: [], parts: [], voice: null, guide: lv.guide };
  ballResize(); ballDraw(-2);
  const takeBtns = `<div class="row wrap"><label class="btn ${MIC_DIRECT ? 'ghost' : ''}" style="flex:1">${ICON.mic} Записать попытку<input type="file" accept="video/*,audio/*" capture="user" class="hidden bfile"></label>
      <label class="btn ghost">${ICON.file} Загрузить запись<input type="file" accept="audio/*,video/*" class="hidden bfile"></label></div>`;
  $('#bctl').innerHTML = (MIC_DIRECT
    ? `<button class="btn block" id="blive">${ICON.play} Играть с микрофоном</button>`
    : `<div class="info small">В этом окне микрофон закрыт, поэтому шарик не может лететь за голосом вживую. Посмотри демо, а попытку запиши видео: шарик пролетит по твоей записи. Вживую игра работает по ссылке в браузере.</div>`) +
    `<div class="row wrap"><button class="btn ghost" id="bdemo">${ICON.play} Демо: как надо</button>
     <label class="check" style="border:0;padding:6px 0;flex:1"><input type="checkbox" id="bguide" ${lv.guide ? 'checked' : ''}><span class="small">Подсказывать ноту перед стеной</span></label></div>
     ${MIC_DIRECT ? '<div class="tiny muted">Лучше в наушниках, тогда подсказки не мешают микрофону. Перед стартом прозвучит первая нота и 3 щелчка.</div><details class="small"><summary class="muted">Нет микрофона? Запиши попытку файлом</summary><div style="margin-top:8px">' + takeBtns + '</div></details>' : takeBtns}`;
  $('#bguide').addEventListener('change', e => B.guide = e.target.checked);
  $('#bdemo').addEventListener('click', () => ballRun('demo'));
  $('#blive')?.addEventListener('click', () => ballLive());
  document.querySelectorAll('.bfile').forEach(inp => inp.addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; e.target.value = ''; ballTake(await f.arrayBuffer()); }));
}
function ballResize() {
  const cv = B.cv, w = cv.parentElement.clientWidth, h = Math.round(Math.min(460, Math.max(300, w * .85))), dpr = window.devicePixelRatio || 1;
  cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px'; cv.style.height = h + 'px';
  B.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); B.W = w; B.H = h;
  const rels = B.walls.map(x => x.rel); B.lo = Math.min(...rels) - 2; B.hi = Math.max(...rels) + 2.5;
  if (B.hi - B.lo < 8) { const m = (B.hi + B.lo) / 2; B.lo = m - 4; B.hi = m + 4; }
  B.floor = h - 46; B.ceil = 26; B.semi = (B.floor - B.ceil) / (B.hi - B.lo);
  B.bx = w * .24; B.r = 10; B.pps = Math.max(110, w * .3) * B.lv.bpm / 60 / 1.6;
  if (B.y == null) B.y = B.floor - B.r;
}
const bY = r => B.floor - (r - B.lo) * B.semi;
const bRel = y => B.lo + (B.floor - y) / B.semi;
function ballGap(w) { return Math.max(1.5, ballTol() / 100 * B.semi); }

// ----- Отрисовка -----
function ballDraw(now) {
  const { ctx, W, H, floor } = B, X = t => B.bx + (t - now) * B.pps;
  // небо
  const sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#2B2F5E'); sky.addColorStop(.6, '#C8573A'); sky.addColorStop(1, '#F2B266');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // солнце и холмы (параллакс)
  ctx.fillStyle = 'rgba(255,224,170,.55)'; ctx.beginPath(); ctx.arc(W * .78, floor - 40, 46, 0, 7); ctx.fill();
  const hills = (k, col, amp, base) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H); for (let x = 0; x <= W + 10; x += 10) { const wx = x + now * B.pps * k; ctx.lineTo(x, base - amp * (Math.sin(wx / 90) * .6 + Math.sin(wx / 37) * .25 + .6)); } ctx.lineTo(W, H); ctx.fill(); };
  hills(.15, 'rgba(70,40,60,.45)', 40, floor); hills(.35, 'rgba(60,30,40,.55)', 26, floor + 4);
  // линии нот
  ctx.font = '700 11px Manrope, system-ui'; ctx.textAlign = 'left';
  const targets = [...new Set(B.walls.map(w => w.rel))];
  for (const r of targets) { ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(0, bY(r)); ctx.lineTo(W, bY(r)); ctx.stroke(); ctx.setLineDash([]); }
  // дорога
  ctx.fillStyle = '#3A2A24'; ctx.fillRect(0, floor, W, H - floor);
  ctx.fillStyle = '#5A4136'; ctx.fillRect(0, floor, W, 6);
  ctx.strokeStyle = 'rgba(255,220,180,.5)'; ctx.lineWidth = 3; ctx.setLineDash([18, 16]); ctx.lineDashOffset = (now * B.pps) % 34;
  ctx.beginPath(); ctx.moveTo(0, floor + 22); ctx.lineTo(W, floor + 22); ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset = 0;
  // стены
  for (const w of B.walls) {
    const x1 = X(w.t0), x2 = Math.max(X(w.t1), x1 + 16); if (x2 < -20 || x1 > W + 20) continue;
    const gy = bY(w.rel), gh = ballGap(w) + B.r + 3;
    const col = w.crashed ? '#B8443A' : w.passed ? '#3C8A5A' : '#6B4E7A', edge = w.crashed ? '#E8695E' : w.passed ? '#7FD39E' : '#A88BBA';
    ctx.fillStyle = col;
    roundRect(ctx, x1, B.ceil - 30, x2 - x1, gy - gh - (B.ceil - 30), 6); ctx.fill();
    roundRect(ctx, x1, gy + gh, x2 - x1, floor - (gy + gh), 6); ctx.fill();
    ctx.fillStyle = edge; ctx.fillRect(x1, gy - gh - 4, x2 - x1, 4); ctx.fillRect(x1, gy + gh, x2 - x1, 4);
    // мишень: зона, куда должен попасть центр шарика
    const tz = ballGap(w);
    ctx.fillStyle = w.crashed ? 'rgba(255,140,120,.35)' : 'rgba(255,214,130,.38)'; ctx.fillRect(x1, gy - tz, x2 - x1, 2 * tz);
    ctx.fillStyle = 'rgba(255,240,200,.9)'; ctx.fillRect(x1, gy - .75, x2 - x1, 1.5);
    // кирпичики
    ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 1;
    for (let yy = B.ceil; yy < floor; yy += 14) { if (yy > gy - gh - 6 && yy < gy + gh + 4) continue; ctx.beginPath(); ctx.moveTo(x1, yy); ctx.lineTo(x2, yy); ctx.stroke(); }
    // подпись ноты
    ctx.fillStyle = '#fff'; ctx.font = '800 13px Manrope, system-ui'; ctx.textAlign = 'center';
    if (x1 > -10) ctx.fillText(VA.noteName(base() + w.rel), x1 + Math.min(24, (x2 - x1) / 2), gy - gh - 10);
  }
  ctx.textAlign = 'left';
  // линейка высоты слева
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, B.ceil - 6, 30, floor - B.ceil + 6);
  ctx.font = '700 10px Manrope, system-ui'; ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (const r of targets) ctx.fillText(VA.noteName(base() + r).slice(0, 4), 3, bY(r) + 3);
  if (B.voice != null) { ctx.fillStyle = '#FFD27A'; ctx.beginPath(); ctx.moveTo(30, bY(B.voice)); ctx.lineTo(38, bY(B.voice) - 5); ctx.lineTo(38, bY(B.voice) + 5); ctx.fill(); }
  // след шарика
  for (let i = 0; i < B.trail.length; i++) { const p = B.trail[i]; const x = B.bx - (now - p.t) * B.pps; if (x < 0) continue; ctx.fillStyle = `rgba(255,230,190,${.05 + .35 * i / B.trail.length})`; ctx.beginPath(); ctx.arc(x, p.y, B.r * (.4 + .5 * i / B.trail.length), 0, 7); ctx.fill(); }
  // шарик
  const g = ctx.createRadialGradient(B.bx - 4, B.y - 4, 2, B.bx, B.y, B.r);
  g.addColorStop(0, '#FFF6E8'); g.addColorStop(.5, B.hurt > now ? '#FF8A7A' : '#FFD27A'); g.addColorStop(1, B.hurt > now ? '#B8443A' : '#E08A2E');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(B.bx, B.y, B.r, 0, 7); ctx.fill();
  // частицы
  B.parts = B.parts.filter(p => now - p.t < .8);
  for (const p of B.parts) { const a = now - p.t; ctx.fillStyle = p.c; ctx.globalAlpha = 1 - a / .8; ctx.fillRect(p.x + p.vx * a, p.y + p.vy * a + 300 * a * a, 4, 4); }
  ctx.globalAlpha = 1;
  // интерфейс
  ctx.font = '16px system-ui'; ctx.fillText('❤️'.repeat(Math.max(0, B.lives)) + '🤍'.repeat(3 - Math.max(0, B.lives)), W - 84, 22);
  const done = B.walls.filter(w => w.passed || w.crashed).length;
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(40, 12, W - 140, 6); ctx.fillStyle = '#FFD27A'; ctx.fillRect(40, 12, (W - 140) * done / B.walls.length, 6);
  if (now < 0 && B.mode !== 'idle') { ctx.font = '700 48px Lora, serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(String(Math.ceil(-now)), W / 2, H / 2); ctx.textAlign = 'left'; }
  if (B.banner && now - B.banner.t < 1) { ctx.font = '800 17px Manrope, system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = B.banner.good ? '#B9F5CF' : '#FFC2BA'; ctx.globalAlpha = 1 - (now - B.banner.t); ctx.fillText(B.banner.text, W / 2, B.floor + 38); ctx.globalAlpha = 1; ctx.textAlign = 'left'; }
}

// ----- Физика и правила (общие для живой игры, демо и попытки) -----
function ballStep(now, dt, voiceRel) {
  // привязка октавы к ближайшей стене
  const next = B.walls.find(w => now < w.t1 + .1) || B.walls[B.walls.length - 1];
  B.voice = voiceRel == null ? null : octLock(B, voiceRel, next.rel);
  if (B.voice != null) {
    const ty = Math.max(B.ceil, Math.min(B.floor - B.r, bY(B.voice)));
    B.y += (ty - B.y) * Math.min(1, dt * 14); B.vy = 0;
  } else {
    B.vy += 900 * dt; B.y += B.vy * dt;
    if (B.y > B.floor - B.r) { B.y = B.floor - B.r; B.vy = -B.vy * .25; if (Math.abs(B.vy) < 30) B.vy = 0; }
  }
  B.trail.push({ t: now, y: B.y }); if (B.trail.length > 18) B.trail.shift();
  const half = B.r / B.pps; // время, за которое шарик проходит свой радиус
  for (const w of B.walls) {
    if (w.passed || w.crashed) continue;
    if (now >= w.t0 - half && now <= w.t1 + half) {
      const inGap = Math.abs(B.y - bY(w.rel)) <= ballGap(w);
      const grace = Math.min(.22, .3 * (w.t1 - w.t0));
      if (now > w.t0 + grace && now <= w.t1) { if (inGap) w.inT += dt; else w.outT += dt; }
      // промах: долго вне дырки, или на выходе из тоннеля внутри меньше половины времени
      const fail = w.outT > .35 || (now > w.t1 && w.inT + w.outT > 0 && w.inT < w.outT);
      if (fail) {
        w.crashed = true; B.lives--; B.hurt = now + .4; B.banner = { t: now, text: 'Бум! ' + (B.lives > 0 ? 'Осталось жизней: ' + B.lives : ''), good: false };
        for (let i = 0; i < 14; i++) B.parts.push({ t: now, x: B.bx, y: B.y, vx: (Math.random() - .8) * 160, vy: (Math.random() - .7) * 200, c: i % 2 ? '#FFD27A' : '#E8695E' });
        if (B.mode !== 'replay') buzz();
      }
    } else if (now > w.t1 + half) {
      w.passed = true;
      for (let i = 0; i < 8; i++) B.parts.push({ t: now, x: B.bx, y: B.y, vx: (Math.random() - .3) * 120, vy: (Math.random() - .5) * 160, c: '#B9F5CF' });
      B.banner = { t: now, text: w.outT < .05 ? 'Чисто!' : 'Пролетел!', good: true };
    }
  }
}
function buzz() { const c = ac(), o = c.createOscillator(), g = c.createGain(); o.type = 'sawtooth'; o.frequency.value = 90; g.gain.setValueAtTime(.12, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .25); o.connect(g).connect(master); o.start(); o.stop(c.currentTime + .3); }
function ballReset(keepResult) { cancelAnimationFrame(B.raf); stopAll(); B.walls.forEach(w => Object.assign(w, { crashed: false, passed: false, inT: 0, outT: 0 })); B.lives = 3; B.trail = []; B.parts = []; B.voice = null; B.oct = null; B.octBuf = []; B.y = B.floor - B.r; B.vy = 0; B.banner = null; B.devs = null; $('#bnote').innerHTML = ''; if (!keepResult) $('#bres').innerHTML = ''; }
function ballSchedule(t0, withMelody) {
  const b = 60 / B.lv.bpm;
  B.walls.forEach((w, i) => {
    if (withMelody) tone(base() + w.rel, t0 + w.t0, w.t1 - w.t0, .2);
    else if (B.guide && (i === 0 || B.walls[i - 1].t1 < w.t0 - .01)) tone(base() + w.rel, t0 + w.t0 - 1.4 * b, .35, .12);
  });
}
function ballCountIn() {
  const c = ac(), b = 60 / B.lv.bpm, t = c.currentTime + .1;
  stopAll(); tone(base() + B.walls[0].rel, t, 1.1);
  for (let i = 0; i < 3; i++) click(t + 1.4 + i * b, i === 0);
  return t + 1.4 + 3 * b + 1.5 * b; // запас на подлёт к первой стене
}
// демо: автопилот поёт правильные ноты
function ballRun(mode) {
  if (B.mode === 'live') return;
  const c = ac(); ballReset(true); B.mode = mode;
  const t0 = ballCountIn(); ballSchedule(t0, true);
  let last = -9;
  const loop = () => {
    if (!B || B.stopped || B.mode !== mode) return;
    const now = c.currentTime - t0, dt = last < -8 ? 0 : Math.min(.05, now - last); last = now;
    const w = B.walls.find(w => now < w.t1 + .05);
    let v = null; if (w && now > w.t0 - .35) v = w.rel; else if (w && now > -.2) v = null;
    ballStep(now, dt, v); ballDraw(now);
    if (now < B.D + .8) B.raf = requestAnimationFrame(loop); else { B.mode = 'idle'; $('#bnote').innerHTML = `<div class="info small" style="margin-top:10px">Это было демо, на твои результаты оно не влияет.${ballState().best[B.lv.n] ? ' Твой рекорд на этом уровне сохранён.' : ' Теперь твоя очередь!'}</div>`; }
  };
  loop();
}
async function ballLive() {
  if (B.mode === 'live') { ballFinish(true); return; }
  const c = ac(); let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }); }
  catch (e) { $('#bres').innerHTML = '<div class="note" style="margin-top:10px"><b>Нет доступа к микрофону.</b><br>1. Если открыл ссылку из Telegram или другого приложения, нажми «Открыть в Safari» (или скопируй ссылку в Safari).<br>2. В Safari нажми «аА» слева от адреса → «Настройки веб-сайта» → «Микрофон» → «Разрешить», потом обнови страницу.<br>3. Если не помогло: Настройки iPhone → Приложения → Safari → Микрофон → «Спросить» или «Разрешить».</div>'; return; }
  ballReset(); B.mode = 'live'; B.stream = stream; busy = true;
  const src = c.createMediaStreamSource(stream), an = c.createAnalyser(); an.fftSize = 4096; src.connect(an);
  const buf = new Float32Array(an.fftSize), hist = [];
  const t0 = ballCountIn(); ballSchedule(t0, false);
  $('#blive').innerHTML = ICON.stop + ' Остановить';
  let last = -9;
  const loop = () => {
    if (!B || B.stopped || B.mode !== 'live') return;
    const now = c.currentTime - t0, dt = last < -8 ? 0 : Math.min(.05, now - last); last = now;
    an.getFloatTimeDomainData(buf);
    hist.push(VA.livePitch(buf, c.sampleRate)); if (hist.length > 3) hist.shift();
    const v = hist.filter(x => x != null);
    ballStep(now, dt, v.length >= 2 ? VA.median(v) - base() : null); ballDraw(now);
    if (B.lives <= 0) { ballFinish(false); return; }
    if (now < B.D + .6) B.raf = requestAnimationFrame(loop); else ballFinish(false);
  };
  loop();
}
function ballFinish(aborted) {
  if (!B) return;
  cancelAnimationFrame(B.raf); if (B.stream) B.stream.getTracks().forEach(t => t.stop()); B.stream = null; afterMic();
  const mode = B.mode; B.mode = 'idle'; busy = false;
  const btn = $('#blive'); if (btn) btn.innerHTML = ICON.play + ' Играть ещё раз';
  if (aborted) { ballReset(); ballDraw(-2); return; }
  ballResult(mode === 'replay' ? 'take' : 'live');
}
// попытка записью: шарик летит по спетым нотам
async function ballTake(arrayBuf) {
  ballReset(); busy = true;
  $('#bres').innerHTML = '<p class="muted small">Слушаю попытку...</p>';
  let audio;
  try { audio = await new Promise((ok, bad) => { const p = ac().decodeAudioData(arrayBuf, ok, bad); if (p && p.then) p.then(ok, bad); }); }
  catch (e) { busy = false; $('#bres').innerHTML = '<div class="note" style="margin-top:10px">Не получилось прочитать файл. Подойдут видео с телефона или аудио m4a, mp3, wav.</div>'; return; }
  setTimeout(() => {
    const chs = [], len = Math.min(audio.length, audio.sampleRate * 60);
    for (let k = 0; k < audio.numberOfChannels; k++) chs.push(audio.getChannelData(k).subarray(0, len));
    const a = VA.analyzeSamples(chs, audio.sampleRate); lastAudio = audio;
    if (!a.segs.length) { busy = false; $('#bres').innerHTML = '<div class="note" style="margin-top:10px">Не слышу в записи голоса. Пой громче и ближе к телефону, на «ма» или «ла».</div>'; return; }
    const ev = VA.evaluate(B.walls.map(w => ({ midi: base() + w.rel, beats: (w.t1 - w.t0) * B.lv.bpm / 60 })), a.segs, false);
    const sung = ev.notes.map(r => r.dev == null ? null : r.ref - base() + r.dev / 100);
    B.devs = ev.notes.map(r => r.dev);
    const c = ac(), t0 = c.currentTime + .3; B.mode = 'replay'; let last = -9;
    $('#bres').innerHTML = '<p class="muted small" style="margin-top:8px">Шарик летит по твоей записи...</p>';
    const loop = () => {
      if (!B || B.stopped || B.mode !== 'replay') return;
      const now = (c.currentTime - t0) - .5, dt = last < -8 ? 0 : Math.min(.05, now - last); last = now;
      const i = B.walls.findIndex(w => now < w.t1 + .05);
      const v = i >= 0 && now > B.walls[i].t0 - .35 ? sung[i] : null;
      ballStep(now, dt, v); ballDraw(now);
      if (now < B.D + .6 && B.lives > 0) B.raf = requestAnimationFrame(loop); else ballFinish(false);
    };
    loop();
  }, 30);
}
function ballResult(mode) {
  const lv = B.lv, passed = B.walls.filter(w => w.passed).length, total = B.walls.length;
  const pct = Math.round(100 * passed / total), st = ballStarsFor(pct, B.lives);
  const g = ballState(), bm = g.best, prev = bm[lv.n], wasOpen = ballUnlocked(lv.n + 1), tol = ballTol();
  g.plays.push({ lvl: lv.n, pct, stars: st, lives: B.lives, mode, tol, date: nowLocal() }); if (g.plays.length > 300) g.plays.splice(0, g.plays.length - 300);
  const record = !prev || rank(st, pct, tol) > rank(prev.stars, prev.pct, bestTol(prev, lv.n));
  if (record) bm[lv.n] = { pct, stars: st, tol, date: nowLocal() };
  save();
  $('#bstars').innerHTML = starStr(bm[lv.n] ? bm[lv.n].stars : 0); $('#bbest').innerHTML = ballBestHTML(lv);
  const opened = !wasOpen && ballUnlocked(lv.n + 1) && lv.n < BALL_LEVELS.length;
  const msg = B.lives <= 0 ? 'Шарик разбился. Посмотри демо и попробуй снова, можно включить подсказку нотой.' : st === 0 ? 'Нужно пролететь 60% стен, чтобы пройти уровень.' : opened ? `Уровень ${lv.n + 1} открыт!` : st === 3 ? 'Все стены чисто! Максимум звёзд.' : `Для следующей звезды нужно ${st === 1 ? '80%' : 'все стены'}.`;
  const notesTxt = B.devs ? B.walls.map((w, i) => { const d = B.devs[i], nm = VA.noteName(base() + w.rel); return d == null ? `${nm} ✗` : w.passed ? `${nm} ✓` : `${nm} ${d > 0 ? '↑' : '↓'}${Math.abs(d)}ц`; }).join(' · ') : B.walls.map(w => `${VA.noteName(base() + w.rel)} ${w.passed ? '✓' : w.crashed ? '✗' : '·'}`).join(' · ');
  $('#bres').innerHTML = `<div class="card sec stack" style="text-align:center">
    <div>${starStr(st, true)}</div>
    <div style="font-family:Lora,serif;font-size:32px;font-weight:600">${passed} из ${total} стен</div>
    <div class="small muted">жизней осталось: ${Math.max(0, B.lives)}${record && prev ? ' · новый рекорд!' : ''}</div>
    <div class="small">${notesTxt}</div>
    <div class="${st ? 'info' : 'note'}">${msg}</div>
    <div class="row wrap" style="justify-content:center">${mode === 'take' && lastAudio ? `<button class="btn ghost" onclick="playAudioLast()">${ICON.play} Моя попытка</button>` : ''}
    ${ballUnlocked(lv.n + 1) && lv.n < BALL_LEVELS.length ? `<button class="btn" onclick="go('ball-${lv.n + 1}')">Уровень ${lv.n + 1} →</button>` : ''}</div></div>`;
  if (opened) toast(`Уровень ${lv.n + 1} открыт!`);
}
window.addEventListener('resize', () => { if (B && B.mode === 'idle') { ballResize(); ballDraw(-2); } });

document.getElementById('gear').innerHTML = ICON.gear;
start();
</script></body></html>
