# Сборка APK для Android с постоянным ключом подписи.
# main -> релиз «android» (постоянная ссылка для телефона), другие ветки -> пробный релиз «android-test».
# Ключ подписи - android/vocal-release.p12.enc (зашифрован), пароль - секрет репозитория ANDROID_KEYSTORE_PASSWORD.
name: android
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Ключ подписи
        env:
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KSP" ]; then echo "::error::Нет секрета ANDROID_KEYSTORE_PASSWORD (Settings -> Secrets and variables -> Actions)"; exit 1; fi
          KSP=$(printf %s "$KSP" | tr -d ' \r\n\t')
          echo "::add-mask::$KSP"
          echo "KSP=$KSP" >> "$GITHUB_ENV"
          # ключ лежит в репозитории зашифрованным (AES-256), пароль - только в секрете
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/vocal-release.p12.enc -out "$RUNNER_TEMP/vocal.p12" -pass env:KSP \
            || { echo "::error::Пароль не подходит (${#KSP} знаков, нужно 32): вставь в ANDROID_KEYSTORE_PASSWORD содержимое ANDROID_KEYSTORE_PASSWORD.txt"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/vocal.p12" -storetype pkcs12 -storepass "$KSP" -alias vocal > /dev/null
      - run: npm ci
      - run: python3 build.py
      - run: npx cap sync android
      - name: Сборка APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/vocal.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ env.KSP }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd android && ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/vocal-pod-bokalom.apk"
      - name: Проверка подписи
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs vocal-pod-bokalom.apk | tee sign.txt
          grep -q "CN=Vocal pod bokal" sign.txt
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then TAG=android; FLAGS=--latest; else TAG=android-test; FLAGS="--prerelease --latest=false"; fi
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" vocal-pod-bokalom.apk --target "$GITHUB_SHA" $FLAGS \
            --title "Android $(date -u +%d.%m.%Y) · сборка ${{ github.run_number }}" \
            --notes "Вокал под бокал для Android. Ветка $GITHUB_REF_NAME, коммит ${GITHUB_SHA::7}. Скачай vocal-pod-bokalom.apk на телефоне и нажми «Обновить»."
