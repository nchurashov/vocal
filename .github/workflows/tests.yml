# Проверка при каждом изменении: собрать сайт и прогнать все тесты (как перед выкладкой)
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci   # esbuild (сборка модулей) и ESLint (границы модулей)
      - run: pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - name: Тесты
        run: |
          export CHROME=$(python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()")
          bash tests/run_all.sh
      - name: Собранный index.html совпадает с src
        run: |
          git diff --exit-code index.html || (echo "index.html не пересобран: запусти python3 build.py и закоммить" && exit 1)
